<head>

<meta name="description" content="Selected architecture and interior projects by Element Design across India.">

<meta property="og:locale" content="en_IN">
<meta property="og:title" content="Portfolio — Element Design">

<meta property="og:url" content="https://YOUR-DOMAIN.com/portfolio.html">

<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="site.css">
</head>
<body class="inner">
<div class="loader" id="loader" aria-hidden="true">
  <div class="ld-row"><div class="ld-name"><img src="logo.png" alt="Element Design logo"><span>ELEMENT DESIGN<sup>®</sup></span></div><b class="ld-count">0</b></div>
  <div class="ld-line"><i></i></div>
</div>
<noscript><style>.loader{display:none}</style></noscript>

<main><div id="app" class="page"></div></main>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script type="module" src="common.js"></script>
<script type="module">
import { hero, contact, boot } from './inner.js';
import { PROJECTS, PORTFOLIO_CATS } from './data.js';
import { setSeo } from './seo.js';
const c = new URLSearchParams(location.search).get('c') || 'all';
const cat = PORTFOLIO_CATS.find(x => x.slug === c) || PORTFOLIO_CATS[0];
setSeo({ title: (cat.slug === 'all' ? 'Portfolio' : cat.name + ' Portfolio') + ' — Element Design', description: cat.slug === 'all' ? 'Selected architecture and interior projects by Element Design across India.' : cat.name + ' projects by Element Design: selected work across India, each drawn around the people who live and work in it.', path: 'portfolio.html' + (cat.slug === 'all' ? '' : '?c=' + cat.slug) });
const list = PROJECTS.filter(p => cat.slug === 'all' || p.cat === cat.slug);
document.getElementById('app').innerHTML = `
${hero({ title: cat.slug === 'all' ? 'Portfolio' : cat.name, sub: 'Selected architecture and interior projects by Element Design across India. Each one is drawn around the people who live and work in it.', img: 'interiors.jpg', pos: 'center 50%', cta: 'Discuss your project' })}
<section class="blk"><div class="wrap">
  <div class="cats">${PORTFOLIO_CATS.map(x => `<a class="${x.slug === cat.slug ? 'on' : ''}" href="portfolio.html${x.slug === 'all' ? '' : '?c=' + x.slug}">${x.name}</a>`).join('')}</div>
  <div class="b-grid">${list.map((p, i) => `<div class="b-card p-card reveal ${i % 2 ? 'd1' : ''}"><div class="b-img" role="img" aria-label="${p.title}" style="background-image:url('${p.img}');background-position:${p.pos}"><div class="pills"><span>${PORTFOLIO_CATS.find(x => x.slug === p.cat).name}</span></div></div><div class="b-row"><h3>${p.title}</h3></div><div class="b-date">${p.meta}</div></div>`).join('')}</div>
</div></section>
${contact()}`;
boot();
</script>
<script type="module" src="motion.js"></script>
</body>
</html>
