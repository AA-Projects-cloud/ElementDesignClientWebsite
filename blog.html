<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("motion")</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — Element Design</title>
<meta name="description" content="News, press and insights from Element Design.">
<link rel="canonical" href="https://YOUR-DOMAIN.com/blog.html">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta name="theme-color" content="#EDE6D6">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Element Design">
<meta property="og:locale" content="en_IN">
<meta property="og:title" content="Blog — Element Design">
<meta property="og:description" content="News, press and insights from Element Design.">
<meta property="og:url" content="https://YOUR-DOMAIN.com/blog.html">
<meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Element Design — premium architecture and interior design">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Blog — Element Design">
<meta name="twitter:description" content="News, press and insights from Element Design.">
<meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.jpg">
<script type="module" src="analytics.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body class="inner">
<div class="loader" id="loader" aria-hidden="true">
  <div class="ld-row"><div class="ld-name"><img src="logo.png" alt="Element Design logo"><span>ELEMENT DESIGN<sup>®</sup></span></div><b class="ld-count">0</b></div>
  <div class="ld-line"><i></i></div>
</div>
<noscript><style>.loader{display:none}</style></noscript>

<main><div id="app" class="page"></div></main>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script type="module" src="common.js"></script>
<script type="module">
import { hero, boot } from './inner.js';
import { BLOG } from './data.js';
const themes = ['All posts', ...new Set(BLOG.map(b => b.theme))];
const cardHTML = (b, i) => `<a class="b-card reveal ${i % 2 ? 'd1' : ''}" href="article.html?slug=${b.slug}" data-theme="${b.theme}">
  <div class="b-img" role="img" aria-label="${b.title}" style="background-image:url('${b.img}');background-position:${b.pos}"><div class="pills"><span>${b.read}</span><span>${b.theme}</span></div></div>
  <div class="b-date">Published: ${b.date}</div>
  <div class="b-row"><h3>${b.title}</h3><em>Read</em></div></a>`;
document.getElementById('app').innerHTML = `
${hero({ title: 'Element Design ® blog', sub: 'News, press and insights from Element Design: our recognition, our thinking and the way we create unique spaces in our signature style.', img: 'drawings.jpg', pos: 'center 40%', backHref: 'index.html', backLabel: 'Home' })}
<section class="blk"><div class="wrap">
  <div class="filter" id="filter"><button type="button"><span><small>Theme</small><span id="fv">All posts</span></span><svg viewBox="0 0 14 8"><path d="M1 1l6 6 6-6"/></svg></button>
    <ul>${themes.map((t, i) => `<li class="${i ? '' : 'on'}" data-t="${t}">${t}</li>`).join('')}</ul></div>
  <div class="b-grid" id="grid">${BLOG.map(cardHTML).join('')}</div>
</div></section>`;
const f = document.getElementById('filter');
f.querySelector('button').onclick = () => f.classList.toggle('open');
document.addEventListener('click', e => { if (!f.contains(e.target)) f.classList.remove('open'); });
f.querySelectorAll('li').forEach(li => li.onclick = () => {
  f.querySelectorAll('li').forEach(x => x.classList.toggle('on', x === li));
  document.getElementById('fv').textContent = li.dataset.t;
  document.querySelectorAll('#grid .b-card').forEach(c => c.style.display = (li.dataset.t === 'All posts' || c.dataset.theme === li.dataset.t) ? '' : 'none');
  f.classList.remove('open');
});
boot();
</script>
<script type="module" src="motion.js"></script>
</body>
</html>
